name: Bug report
description: Something in Teachie Beachie doesn't work as it should, in a lesson or when installing.
title: "[Lesson ] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying Teachie Beachie! The lesson, the step and the words on the screen are what help most.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - A lesson
        - The installer page
        - Sending the lessons
        - SLOOP 3 itself, with no lesson running
        - Something else
    validations:
      required: true
  - type: input
    id: lesson
    attributes:
      label: Lesson and step
      description: The lesson's number, and the step if you know it.
      placeholder: "Lesson 16, the card that says: Why copy a page?"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        I did: ...
        I expected: ...
        Instead: ...
    validations:
      required: true
  - type: textarea
    id: screen
    attributes:
      label: What the screen showed
      description: The words on the card or strip, or any message, exactly as written. A photo helps.
  - type: dropdown
    id: chip
    attributes:
      label: Your FM-1's flash chip
      description: M-Flasher shows it as FLASH CHIP.
      options:
        - I don't know
        - The original (0x856014)
        - The newer UCUN UC25HQ80 (0xB36014)
  - type: input
    id: version
    attributes:
      label: Teachie Beachie version
      description: Shown in step 5 of the installer page, next to Firmware.
      placeholder: "v0.1 · SLOOP 3.3.7"
  - type: input
    id: computer
    attributes:
      label: Computer and browser (for the installer page)
      placeholder: "macOS, Chrome"
